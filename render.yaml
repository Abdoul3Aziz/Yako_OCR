services:
  - type: web
    name: yako-ocr
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: FLAGS_use_mkldnn
        value: "0"
      - key: FLAGS_enable_pir_api
        value: "0"
      - key: FLAGS_enable_pir_in_executor
        value: "0"
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: "True"
